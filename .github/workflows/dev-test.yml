name: Development and Testing
on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - main
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          # setup-node v5 默认缓存 pnpm store(而非 node_modules), 安装走 store 硬链接,
          # 速度足够且规避了 Windows 上 actions/cache 还原 node_modules 后 esbuild 等二进制损坏的问题
      - run: npm i -g @vscode/vsce
      - name: Install dependencies
        run: pnpm i --frozen-lockfile --ignore-scripts || pnpm i --ignore-scripts
      - run: |
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/dbus/system_bus_socket
          sudo systemctl start dbus
          xvfb-run -a pnpm test:suite:mocha
        if: runner.os == 'Linux'
      - run: pnpm test:suite:mocha
        if: runner.os != 'Linux'
      - run: pnpm run test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: runner.os == 'Linux'
        with:
          files: ./coverage/lcov.info
          flags: unittests
      - run: vsce package --no-dependencies
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: vsix-package
          path: '*.vsix'
