name: Publish to VSCode Store
on:
  push:
    tags:
      - '*'
  # release:
  #   types:
  #     - published
  workflow_dispatch:
jobs:
  package-publish:
    permissions:
      contents: write
      # Marketplace Trusted Publishing(OIDC) 需要 id-token 权限,
      # 参见 https://code.visualstudio.com/api/working-with-extensions/publishing-extension#secure-automated-publishing-to-visual-studio-marketplace
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: npm i -g @vscode/vsce ovsx
      - name: Install dependencies
        run: pnpm i --frozen-lockfile --ignore-scripts
      - name: Publish
        env:
          # OpenVSX 暂不支持 OIDC, 仍需 PAT
          OPENVSX_PUBLISH_TOKEN: ${{ secrets.OPENVSX_PUBLISH_TOKEN }}
        run: |
          vsce package --no-dependencies
          # Marketplace 使用 Trusted Publishing(OIDC), 无需 PAT
          vsce publish --no-dependencies --oidc
          ovsx publish --no-dependencies -p $OPENVSX_PUBLISH_TOKEN
      # - name: Upload assets
      #   uses: softprops/action-gh-release@v1
      #   if: startsWith(github.ref, 'refs/tags/')
      #   with:
      #     files: '*.vsix'
      - run: |
          # 使用sed命令提取最新的版本记录
          cat CHANGELOG.md | awk '/^# \[/ {if (flag) exit; flag=1} flag {print}' > body.md
      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          artifacts: '*.vsix'
          bodyFile: 'body.md'
